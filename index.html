<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragmented Social Realities</title>
<meta name="description" content="Fragmented Social Realities — a proposed workshop at CHI 2027. The workshop website will go live if the proposal is accepted.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed generative field of sliced, offset "realities"; text anchored lower-left over a soft scrim. */
  :root {
    --ink: #061619;        /* ground: deep teal ink */
    --tide: #1b5c5a;       /* reality A mid-tone */
    --ice: #d6f1f2;        /* primary text, contour lines */
    --flare: #ff3d8b;      /* reality B accent */
    --sodium: #ff9a3c;     /* reality B warm */
    --muted: #9fc2c3;
    --font-display: "Syne", "Arial Black", "Helvetica Neue", sans-serif;
    --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--ice);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  #field {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  .scrim {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 0% 100%, color-mix(in srgb, var(--ink) 88%, transparent) 0%, color-mix(in srgb, var(--ink) 55%, transparent) 38%, transparent 70%),
      linear-gradient(to top, color-mix(in srgb, var(--ink) 70%, transparent), transparent 45%);
  }
  main {
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2rem;
    padding-inline: clamp(16px, 5vw, 72px);
    padding-block: clamp(20px, 4vw, 48px);
  }
  .meta {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 1.5rem;
    font-family: var(--font-mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .meta b { color: var(--ice); font-weight: 500; }
  .content {
    align-self: end;
    max-width: 58rem;
    min-width: 0;
    display: grid; gap: 1.5rem;
  }
  .eyebrow {
    margin: 0;
    font-family: var(--font-mono); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--sodium);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 7.5rem);
    line-height: .92;
    letter-spacing: -.02em;
    text-wrap: balance;
  }
  h1 .line { display: block; position: relative; }
  /* one word is shifted out of register, like a misaligned slice */
  h1 .shift { display: inline-block; transform: translateX(.18em); color: transparent; -webkit-text-stroke: 2px var(--ice); }
  .status {
    margin: 0;
    max-width: 34rem;
    font-size: clamp(1.05rem, 1.6vw, 1.3rem);
    line-height: 1.5;
    color: var(--ice);
  }
  .status strong { font-weight: 500; color: var(--flare); }
  footer {
    font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) { #field { transition: none; } }
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<main>
  <div class="meta">
    <span><b>CHI 2027</b> · Workshop</span>
    <span>Status: proposal under review</span>
  </div>

  <section class="content">
    <p class="eyebrow">Proposed workshop</p>
    <h1>
      <span class="line">Fragmented</span>
      <span class="line"><span class="shift">Social</span></span>
      <span class="line">Realities</span>
    </h1>
    <p class="status">The workshop website will go live <strong>if the proposal is accepted</strong>. Please check back after CHI 2027 workshop notifications.</p>
  </section>

  <footer>ACM CHI Conference on Human Factors in Computing Systems 2027</footer>
</main>

<script>
(() => {
  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- 3D value noise ----
  const P = new Uint8Array(512);
  { const p = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
  const fade = t => t * t * (3 - 2 * t);
  const h = (x, y, z) => P[P[P[x & 255] + (y & 255)] + (z & 255)] / 255;
  function noise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = fade(xf), v = fade(yf), w = fade(zf);
    const l = (a, b, t) => a + (b - a) * t;
    return l(
      l(l(h(xi, yi, zi), h(xi+1, yi, zi), u), l(h(xi, yi+1, zi), h(xi+1, yi+1, zi), u), v),
      l(l(h(xi, yi, zi+1), h(xi+1, yi, zi+1), u), l(h(xi, yi+1, zi+1), h(xi+1, yi+1, zi+1), u), v),
      w);
  }

  // ---- two low-res "realities" rendered as banded, domain-warped fields ----
  const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const palA = ['#061619', '#0a2a2e', '#10403f', '#1b5c5a', '#2c7a72', '#4b9a8e'].map(hex);
  const palB = ['#1a0718', '#3d0c33', '#6b1446', '#b0205e', '#ff3d8b', '#ff9a3c'].map(hex);
  const lineA = hex('#d6f1f2'), lineB = hex('#ffd9a8');

  function makeField(w, hgt) {
    const c = document.createElement('canvas'); c.width = w; c.height = hgt;
    const cx = c.getContext('2d');
    return { c, cx, img: cx.createImageData(w, hgt) };
  }
  let A, B, Ap, W = 0, H = 0, DPR = 1;
  const RES = 5; // screen px per field px

  function paint(f, t, pal, line, scale, seed) {
    const { img } = f, d = img.data, w = img.width, hh = img.height;
    const bands = pal.length;
    let k = 0;
    for (let y = 0; y < hh; y++) {
      for (let x = 0; x < w; x++) {
        const nx = x * scale, ny = y * scale;
        const wx = noise(nx * .6 + seed, ny * .6, t * .35) * 2.4;
        const wy = noise(nx * .6, ny * .6 + seed, t * .35 + 7) * 2.4;
        let v = noise(nx + wx, ny + wy, t + seed) * .75 + noise(nx * 2.1, ny * 2.1, t * 1.3) * .25;
        v = Math.min(.999, Math.max(0, (v - .18) * 1.55));
        const s = v * bands, bi = s | 0, fr = s - bi;
        const c = pal[bi];
        const edge = fr < .07 ? .55 : 0;
        d[k]   = c[0] + (line[0] - c[0]) * edge;
        d[k+1] = c[1] + (line[1] - c[1]) * edge;
        d[k+2] = c[2] + (line[2] - c[2]) * edge;
        d[k+3] = 255;
        k += 4;
      }
    }
    f.cx.putImageData(img, 0, 0);
  }

  // ---- fragments: horizontal slices showing reality B, and tilted panes of reality A ----
  let slices = [], panes = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  function cut() {
    slices = [];
    let y = rand(0, H * .08);
    while (y < H) {
      const hgt = rand(H * .015, H * .11);
      if (Math.random() < .42) slices.push({ y, h: hgt, amp: rand(20, 120), spd: rand(.2, .9), ph: rand(0, 6.28), pix: Math.random() < .5 });
      y += hgt + rand(H * .02, H * .14);
    }
  }
  function placePanes() {
    panes = Array.from({ length: 3 }, (_, i) => ({
      x: rand(.35, .85) * W, y: rand(.1, .7) * H,
      w: rand(.16, .3) * Math.max(W, 600), h: rand(.2, .42) * H,
      rot: rand(-.22, .22), zoom: rand(1.4, 2.4), dt: rand(2, 6), depth: .02 + i * .025
    }));
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    const fw = Math.ceil(W / RES), fh = Math.ceil(H / RES);
    A = makeField(fw, fh); B = makeField(fw, fh);
    Ap = makeField(fw, fh);
    cut(); placePanes();
  }

  let mx = 0, my = 0, tmx = 0, tmy = 0;
  addEventListener('pointermove', e => { tmx = e.clientX / W - .5; tmy = e.clientY / H - .5; });

  let lastCut = 0, n = 0;
  function frame(ms) {
    const t = ms / 1000;
    const tt = t * .06;
    mx += (tmx - mx) * .05; my += (tmy - my) * .05;

    // alternate which fields refresh each frame to keep the cost down
    const odd = (n++ & 1) === 1;
    if (!odd || reduce) { paint(A, tt, palA, lineA, .018, 0); paint(B, tt * 1.4 + 40, palB, lineB, .026, 91); }
    if (odd || reduce) paint(Ap, tt + 3.3, palA, lineA, .012, 17);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(A.c, 0, 0, W, H);

    // slices of the other reality, sliding out of register
    for (const s of slices) {
      const off = Math.sin(t * s.spd + s.ph) * s.amp + mx * 60;
      ctx.imageSmoothingEnabled = !s.pix;
      ctx.globalAlpha = .88;
      ctx.drawImage(B.c, 0, s.y / RES, B.c.width, s.h / RES, off, s.y, W, s.h);
      ctx.drawImage(B.c, 0, s.y / RES, B.c.width, s.h / RES, off - W * Math.sign(off || 1), s.y, W, s.h);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(214,241,242,.35)';
      ctx.fillRect(0, s.y, W, 1);
    }
    ctx.imageSmoothingEnabled = true;

    // tilted panes: the same world, zoomed and out of step in time
    for (const p of panes) {
      const px = p.x + mx * W * p.depth * 4, py = p.y + my * H * p.depth * 4;
      ctx.save();
      ctx.translate(px, py); ctx.rotate(p.rot + Math.sin(t * .15 + p.dt) * .02);
      ctx.beginPath(); ctx.rect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.clip();
      const zw = W * p.zoom / 2, zh = H * p.zoom / 2;
      ctx.drawImage(Ap.c, -zw / 2 - mx * 40, -zh / 2 - my * 40, zw, zh);
      ctx.fillStyle = 'rgba(255,61,139,.10)';
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      ctx.save();
      ctx.translate(px, py); ctx.rotate(p.rot + Math.sin(t * .15 + p.dt) * .02);
      ctx.strokeStyle = 'rgba(214,241,242,.7)'; ctx.lineWidth = 1;
      ctx.strokeRect(-p.w / 2 + .5, -p.h / 2 + .5, p.w - 1, p.h - 1);
      ctx.restore();
    }

    if (t - lastCut > 7) { lastCut = t; cut(); }
    if (!reduce) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => { resize(); if (reduce) frame(12000); });
  resize();
  if (reduce) frame(12000); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
